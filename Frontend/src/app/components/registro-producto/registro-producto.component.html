<!-- Componente de alerta de éxito que se muestra tras registrar un producto -->
<app-alerta-exito
  [mostrar]="mostrarAlerta"
  titulo="Producto registrado"
  mensaje="El producto se ha agregado correctamente al sistema">
</app-alerta-exito>

<!-- Contenedor principal del formulario -->
<div class="container-page">
  
  <!-- Encabezado del formulario -->
  <div class="form-header">
    <button (click)="onCancel()" class="btn-back">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Volver al listado
    </button>
    <h1 class="form-title">Registrar Nuevo Producto</h1>
    <p class="form-description">Complete los campos para agregar un nuevo producto al sistema</p>
  </div>

  <!-- Tarjeta del formulario -->
  <div class="form-card">
    <form [formGroup]="productoForm" (ngSubmit)="onSubmit()">
      
      <!-- Nombre -->
      <div class="form-group">
        <label class="form-label">Nombre del Producto</label>
        <input 
          type="text" 
          formControlName="nombre" 
          placeholder="Ej. Teclado Mecánico"
          class="form-input"
          [class.is-invalid]="f['nombre'].invalid && (f['nombre'].touched || isSubmitted)"
        />
        <div *ngIf="f['nombre'].invalid && (f['nombre'].touched || isSubmitted)" class="error-messages">
          <span *ngFor="let error of getErrors('nombre')" class="error-text">• {{ error }}</span>
        </div>
      </div>

      <!-- Descripción -->
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <textarea 
          formControlName="descripcion" 
          rows="3" 
          placeholder="Descripción detallada del producto"
          class="form-input"
          [class.is-invalid]="f['descripcion'].invalid && (f['descripcion'].touched || isSubmitted)"
        ></textarea>
        <div *ngIf="f['descripcion'].invalid && (f['descripcion'].touched || isSubmitted)" class="error-messages">
          <span *ngFor="let error of getErrors('descripcion')" class="error-text">• {{ error }}</span>
        </div>
      </div>

      <!-- Fila de Precio y Stock -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Precio (Q)</label>
          <input 
            type="number" 
            formControlName="precio" 
            step="0.01" 
            placeholder="0.00"
            class="form-input"
            [class.is-invalid]="f['precio'].invalid && (f['precio'].touched || isSubmitted)"
          />
          <div *ngIf="f['precio'].invalid && (f['precio'].touched || isSubmitted)" class="error-messages">
            <span *ngFor="let error of getErrors('precio')" class="error-text">• {{ error }}</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Stock</label>
          <input 
            type="number" 
            formControlName="stock" 
            placeholder="0"
            class="form-input"
            [class.is-invalid]="f['stock'].invalid && (f['stock'].touched || isSubmitted)"
          />
          <div *ngIf="f['stock'].invalid && (f['stock'].touched || isSubmitted)" class="error-messages">
            <span *ngFor="let error of getErrors('stock')" class="error-text">• {{ error }}</span>
          </div>
        </div>
      </div>

      <!-- Categoría -->
      <div class="form-group">
        <label class="form-label">Categoría</label>
        <input 
          type="text" 
          formControlName="categoria" 
          placeholder="Ej. Periféricos"
          class="form-input"
          [class.is-invalid]="f['categoria'].invalid && (f['categoria'].touched || isSubmitted)"
        />
        <div *ngIf="f['categoria'].invalid && (f['categoria'].touched || isSubmitted)" class="error-messages">
          <span *ngFor="let error of getErrors('categoria')" class="error-text">• {{ error }}</span>
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="form-actions">
        <button type="button" (click)="onCancel()" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="productoForm.invalid && isSubmitted">
          Registrar Producto
        </button>
      </div>

    </form>
  </div>
</div>
