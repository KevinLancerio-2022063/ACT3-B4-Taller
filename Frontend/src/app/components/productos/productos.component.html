<!-- Contenedor principal con estilo-->
<div class="container-page">
  
  <!-- Encabezado con titulo, descripcion y botones de accion -->
  <div class="header-section">
    <div>
      <h1 class="page-title">Gestion de Productos</h1>
      <p class="page-description">Consulta, registra y agrega productos al carrito</p>
    </div>
    <div class="header-buttons">
      <button (click)="irACarrito()" class="btn-carrito">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Ver Carrito
      </button>
      <button (click)="irARegistro()" class="btn-primary">
        <span>+</span> Registrar Producto
      </button>
    </div>
  </div>

  <!-- Barra de busqueda con icono -->
  <div class="search-container">
    <div class="search-box">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Buscar por nombre, categoria o descripcion..."
        class="search-input"
      />
    </div>
  </div>

  <!-- Contenedor de la tabla con estilo de tarjeta -->
  <div class="table-container">
    
    <!-- Estado vacio cuando no hay productos o no coinciden con la busqueda -->
    <div *ngIf="filteredProductos.length === 0" class="empty-state">
      <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <p>No hay productos registrados</p>
    </div>

    <!-- Tabla de datos -->
    <table *ngIf="filteredProductos.length > 0" class="data-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Categoria</th>
          <th>Descripcion</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let producto of filteredProductos">
          <td class="font-medium">{{ producto.nombre }}</td>
          <td><span class="badge">{{ producto.categoria }}</span></td>
          <td class="text-muted">{{ producto.descripcion }}</td>
          <td class="font-medium text-success">Q{{ producto.precio | number:"1.2-2" }}</td>
          <td>
            <!-- Barra visual de stock -->
            <div class="stock-bar-container">
              <span>{{ producto.stock }}</span>
              <div class="stock-bar-bg">
                <div class="stock-bar-fill" [ngClass]="getStockPercentage(producto.stock) >= 80 ? 'high' : (getStockPercentage(producto.stock) >= 50 ? 'medium' : 'low')" [style.width.%]="getStockPercentage(producto.stock)"></div>
              </div>
            </div>
          </td>
          <td>
            <!-- Boton para agregar al carrito con feedback visual -->
            <button 
              (click)="agregarAlCarrito(producto)" 
              class="btn-agregar-carrito"
              [class.agregando]="productoAgregando === producto.id"
              [disabled]="productoAgregando !== null">
              <svg *ngIf="productoAgregando !== producto.id" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
              <svg *ngIf="productoAgregando === producto.id" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span *ngIf="productoAgregando !== producto.id">Agregar</span>
              <span *ngIf="productoAgregando === producto.id">Agregado</span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
